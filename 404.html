<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Navaneeth CT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#F3EEE2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&display=swap">

  <style>
  :root {
    color-scheme: light;
    --paper: #f3eee2;
    --ink:   #1b2bd0;
    --rule:  1.5px;
    --pad:   clamp(1.25rem, 4vw, 2.5rem);
    --font:  "Familjen Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.125rem;
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--ink); color: var(--paper); }

  :focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  .wrap {
    max-width: 86rem;
    margin: 0 auto;
    padding: 0 var(--pad) var(--pad);
  }

  .top {
    padding: 1.5rem 0 1.125rem;
    border-bottom: var(--rule) solid var(--ink);
    font-size: 1.0625rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .say {
    max-width: 14em;
    margin: clamp(3rem, 8vw, 5.5rem) 0 0 -0.05em;
    font-size: clamp(2.375rem, 1rem + 4.6vw, 4.75rem);
    font-weight: 500;
    line-height: 1.03;
    letter-spacing: -0.038em;
    text-wrap: balance;
  }

  .home {
    display: inline-block;
    margin-top: clamp(1.75rem, 4vw, 2.75rem);
    font-size: clamp(1.1875rem, 1rem + 0.6vw, 1.375rem);
    font-weight: 500;
    text-decoration: underline;
    text-decoration-thickness: var(--rule);
    text-underline-offset: 0.18em;
  }

  @media (hover: hover) {
    .home:hover { text-decoration-thickness: 2.5px; }
  }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top"><a href="/">Navaneeth CT</a></header>
  <main>
    <h1 class="say">Page not found. There is nothing at this address.</h1>
    <a class="home" href="/">Go to the home page</a>
  </main>
</div>
</body>
</html>
