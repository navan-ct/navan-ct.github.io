<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Navaneeth CT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#F3F4F6">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap">

  <style>
  :root {
    color-scheme: light;
    --canvas: #f3f4f6;
    --ink:    #14161b;
    --body:   #474d59;
    --faint:  #7f8693;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(70rem 30rem at 50% -8rem, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
      var(--canvas);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection { background: var(--ink); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .page {
    max-width: 58rem;
    margin: 0 auto;
    padding: clamp(3rem, 9vw, 6.5rem) clamp(1rem, 5vw, 2rem) 3rem;
  }

  .mark {
    display: block;
    width: 3rem;
    height: 3rem;
    border-radius: 0.8125rem;
    background: linear-gradient(180deg, #2c2f38 0%, #14161b 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 1px 2px rgba(20, 22, 27, 0.24),
      0 10px 18px -8px rgba(20, 22, 27, 0.4);
  }

  h1,
  .sub {
    margin: 0;
    font-size: clamp(2.125rem, 1.45rem + 3vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.08;
  }

  h1 { margin-top: 1.75rem; }

  .sub { color: var(--faint); }

  .home {
    display: inline-block;
    margin-top: 1.375rem;
    font-size: 1.0625rem;
    font-weight: 500;
    color: var(--body);
    text-decoration: underline;
    text-decoration-color: rgba(20, 22, 27, 0.2);
    text-underline-offset: 0.2em;
    transition: color 160ms ease, text-decoration-color 160ms ease;
  }

  @media (hover: hover) {
    .home:hover {
      color: var(--ink);
      text-decoration-color: currentColor;
    }
  }
  </style>
</head>
<body>
  <main class="page">
    <a href="/" aria-label="Navaneeth CT, home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M10.5 22V10l11 12V10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1>Page not found</h1>
    <p class="sub">There is nothing at this address.</p>
    <a class="home" href="/">Go to the home page</a>
  </main>
</body>
</html>
